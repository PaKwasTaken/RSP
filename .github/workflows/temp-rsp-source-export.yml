name: Temporary RSP source export
on:
  push:
    branches:
      - rsp-7.9.2
permissions:
  contents: read
jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Package SourcePawn file
        uses: actions/upload-artifact@v4
        with:
          name: RSP_7.9.2-source
          path: RSP_7.9.2.sp
          if-no-files-found: error
          retention-days: 1
